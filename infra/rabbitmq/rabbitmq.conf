# Without this, RabbitMQ's default /metrics endpoint only exposes
# cluster-wide aggregated metrics (e.g. total messages across ALL
# queues) -- there's no way to see "how many messages are backed up in
# the `experiments` queue specifically" without per-object metrics
# enabled. This is exactly the queue-depth story observe.py already
# demonstrates in the terminal (see scripts/observe.py) -- now visible
# in Grafana too, per queue.
prometheus.return_per_object_metrics = true